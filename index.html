```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f5f5">
  <title>Macro Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
    }

    #date {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .macro-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .macro-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .macro-name {
      font-size: 20px;
      font-weight: 700;
    }

    .macro-value {
      font-size: 30px;
      font-weight: 700;
    }

    .target {
      color: #777;
      font-size: 14px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 5px;
      font-size: 15px;
      font-weight: 600;
      background: #e9e9e9;
      color: #111;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    .custom {
      background: #dcdcdc;
    }

    .minus {
      background: #ededed;
    }

    .calories {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-top: 18px;
      margin-bottom: 14px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .calories-label {
      color: #666;
      font-size: 15px;
    }

    .calories-value {
      font-size: 34px;
      font-weight: 700;
      margin-top: 5px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .action-button {
      background: #111;
      color: white;
      padding: 14px;
    }

    .settings {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .settings h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .target-row {
      display: grid;
      grid-template-columns: 1fr 100px;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .save-targets {
      width: 100%;
      background: #111;
      color: white;
      margin-top: 8px;
    }

    .progress {
      height: 8px;
      background: #e5e5e5;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #111;
      transition: width 0.2s ease;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Macro Tracker</h1>
    <div id="date"></div>

    <!-- PROTEIN -->
    <div class="macro-card">
      <div class="macro-header">
        <div>
          <div class="macro-name">Protein</div>
          <div class="target">Target: <span id="proteinTarget">135</span> g</div>
        </div>
        <div>
          <span class="macro-value" id="proteinValue">0</span> g
        </div>
      </div>

      <div class="buttons">
        <button onclick="addMacro('protein', 1)">+1</button>
        <button onclick="addMacro('protein', 5)">+5</button>
        <button class="custom" onclick="customAdd('protein')">Custom</button>
        <button class="minus" onclick="addMacro('protein', -1)">−1</button>
      </div>

      <div class="progress">
        <div class="progress-bar" id="proteinProgress"></div>
      </div>
    </div>

    <!-- CARBS -->
    <div class="macro-card">
      <div class="macro-header">
        <div>
          <div class="macro-name">Carbs</div>
          <div class="target">Target: <span id="carbsTarget">350</span> g</div>
        </div>
        <div>
          <span class="macro-value" id="carbsValue">0</span> g
        </div>
      </div>

      <div class="buttons">
        <button onclick="addMacro('carbs', 1)">+1</button>
        <button onclick="addMacro('carbs', 5)">+5</button>
        <button class="custom" onclick="customAdd('carbs')">Custom</button>
        <button class="minus" onclick="addMacro('carbs', -1)">−1</button>
      </div>

      <div class="progress">
        <div class="progress-bar" id="carbsProgress"></div>
      </div>
    </div>

    <!-- FAT -->
    <div class="macro-card">
      <div class="macro-header">
        <div>
          <div class="macro-name">Fat</div>
          <div class="target">Target: <span id="fatTarget">70</span> g</div>
        </div>
        <div>
          <span class="macro-value" id="fatValue">0</span> g
        </div>
      </div>

      <div class="buttons">
        <button onclick="addMacro('fat', 1)">+1</button>
        <button onclick="addMacro('fat', 5)">+5</button>
        <button class="custom" onclick="customAdd('fat')">Custom</button>
        <button class="minus" onclick="addMacro('fat', -1)">−1</button>
      </div>

      <div class="progress">
        <div class="progress-bar" id="fatProgress"></div>
      </div>
    </div>

    <!-- CALORIES -->
    <div class="calories">
      <div class="calories-label">Calories</div>
      <div class="calories-value" id="caloriesValue">0</div>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <button class="action-button" onclick="undo()">Undo</button>
      <button class="action-button" onclick="resetDay()">Reset Day</button>
    </div>

    <!-- TARGET SETTINGS -->
    <div class="settings">
      <h2>Daily Targets</h2>

      <div class="target-row">
        <label for="proteinInput">Protein (g)</label>
        <input id="proteinInput" type="number" min="0">
      </div>

      <div class="target-row">
        <label for="carbsInput">Carbs (g)</label>
        <input id="carbsInput" type="number" min="0">
      </div>

      <div class="target-row">
        <label for="fatInput">Fat (g)</label>
        <input id="fatInput" type="number" min="0">
      </div>

      <button class="save-targets" onclick="saveTargets()">Save Targets</button>
    </div>

  </div>

  <script>
    const DATA_KEY = "macroData";
    const DATE_KEY = "macroDate";
    const TARGET_KEY = "macroTargets";
    const HISTORY_KEY = "macroHistory";

    let data = {
      protein: 0,
      carbs: 0,
      fat: 0
    };

    let targets = {
      protein: 135,
      carbs: 350,
      fat: 70
    };

    let history = [];

    function todayString() {
      const now = new Date();
      return now.toISOString().split("T")[0];
    }

    function loadData() {
      const savedDate = localStorage.getItem(DATE_KEY);
      const today = todayString();

      if (savedDate !== today) {
        data = {
          protein: 0,
          carbs: 0,
          fat: 0
        };

        history = [];

        localStorage.setItem(DATA_KEY, JSON.stringify(data));
        localStorage.setItem(DATE_KEY, today);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      } else {
        const savedData = localStorage.getItem(DATA_KEY);
        const savedHistory = localStorage.getItem(HISTORY_KEY);
        const savedTargets = localStorage.getItem(TARGET_KEY);

        if (savedData) {
          data = JSON.parse(savedData);
        }

        if (savedHistory) {
          history = JSON.parse(savedHistory);
        }

        if (savedTargets) {
          targets = JSON.parse(savedTargets);
        }
      }

      updateTargetInputs();
      updateDisplay();
    }

    function saveData() {
      localStorage.setItem(DATA_KEY, JSON.stringify(data));
      localStorage.setItem(DATE_KEY, todayString());
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    }

    function addMacro(macro, amount) {
      history.push({
        protein: data.protein,
        carbs: data.carbs,
        fat: data.fat
      });

      data[macro] += amount;

      if (data[macro] < 0) {
        data[macro] = 0;
      }

      saveData();
      updateDisplay();
    }

    function customAdd(macro) {
      const value = prompt("Enter amount to add:");

      if (value === null || value.trim() === "") {
        return;
      }

      const amount = Number(value);

      if (!Number.isFinite(amount) || amount <= 0) {
        alert("Please enter a positive number.");
        return;
      }

      addMacro(macro, amount);
    }

    function undo() {
      if (history.length === 0) {
        return;
      }

      const previous = history.pop();

      data = {
        protein: previous.protein,
        carbs: previous.carbs,
        fat: previous.fat
      };

      saveData();
      updateDisplay();
    }

    function resetDay() {
      if (!confirm("Reset all macros for today?")) {
        return;
      }

      history.push({
        protein: data.protein,
        carbs: data.carbs,
        fat: data.fat
      });

      data = {
        protein: 0,
        carbs: 0,
        fat: 0
      };

      saveData();
      updateDisplay();
    }

    function saveTargets() {
      const protein = Number(document.getElementById("proteinInput").value);
      const carbs = Number(document.getElementById("carbsInput").value);
      const fat = Number(document.getElementById("fatInput").value);

      if (
        !Number.isFinite(protein) || protein < 0 ||
        !Number.isFinite(carbs) || carbs < 0 ||
        !Number.isFinite(fat) || fat < 0
      ) {
        alert("Please enter valid target numbers.");
        return;
      }

      targets = {
        protein,
        carbs,
        fat
      };

      localStorage.setItem(TARGET_KEY, JSON.stringify(targets));

      updateDisplay();
    }

    function updateTargetInputs() {
      document.getElementById("proteinInput").value = targets.protein;
      document.getElementById("carbsInput").value = targets.carbs;
      document.getElementById("fatInput").value = targets.fat;

      document.getElementById("proteinTarget").textContent = targets.protein;
      document.getElementById("carbsTarget").textContent = targets.carbs;
      document.getElementById("fatTarget").textContent = targets.fat;
    }

    function updateDisplay() {
      document.getElementById("proteinValue").textContent = formatNumber(data.protein);
      document.getElementById("carbsValue").textContent = formatNumber(data.carbs);
      document.getElementById("fatValue").textContent = formatNumber(data.fat);

      document.getElementById("proteinTarget").textContent = formatNumber(targets.protein);
      document.getElementById("carbsTarget").textContent = formatNumber(targets.carbs);
      document.getElementById("fatTarget").textContent = formatNumber(targets.fat);

      document.getElementById("caloriesValue").textContent =
        Math.round(
          data.protein * 4 +
          data.carbs * 4 +
          data.fat * 9
        );

      updateProgress("protein");
      updateProgress("carbs");
      updateProgress("fat");
    }

    function updateProgress(macro) {
      const target = targets[macro];

      let percentage = 0;

      if (target > 0) {
        percentage = (data[macro] / target) * 100;
      }

      percentage = Math.min(percentage, 100);

      document.getElementById(macro + "Progress").style.width =
        percentage + "%";
    }

    function formatNumber(value) {
      if (Number.isInteger(value)) {
        return value;
      }

      return Number(value.toFixed(1));
    }

    function updateDate() {
      const date = new Date();

      document.getElementById("date").textContent =
        date.toLocaleDateString(undefined, {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });
    }

    updateDate();
    loadData();

    setInterval(() => {
      const currentDate = todayString();
      const savedDate = localStorage.getItem(DATE_KEY);

      if (savedDate !== currentDate) {
        loadData();
        updateDate();
      }
    }, 60000);
  </script>

</body>
</html>
